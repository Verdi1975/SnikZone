
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        color: black;
        background-color: #f5f7fa;
        line-height: 1.6;
        margin: 0;
    }

    img {
        max-width: 100%;
        display: block;
    }

    h1 {
        color: #ff6b35;
        font-size: 40px;
    }

    h1 span {
        color: rgb(255, 255, 255);
    }

    h2 {
        color: black;
        font-size: 26px;
        border-bottom: 3px solid #ff6b35;
        padding-bottom: 6px;
    }

    h3 {
        color: #000;
    }

    /* cabeçalho/menu */
    header {
        background-color: #0d1b2a;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
    }

    header a {
        color: #ffffff;
        text-decoration: none;
        font-weight: bold;
    }

    nav a {
        transition: color .2s;
    }

    nav a: hover{
        color: #ff6b35;

    }


    nav ul {
        list-style: none;
        margin: 10px 0 0;
        padding: 0;
    }

    nav li {
        display: inline-block;
        margin-right: 16px;
    }

    nav li a {
        color: #e3e8ef;
        font-weight: normal;
    }


    main section {
        max-width: 100px;
        margin: 30px auto;
        padding: 0 20px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background-color: #ffffff;
    }

    td {
        border: 1px solid #e3e8ef;
        padding: 10px;
        text-align: left;
    }

    th {
        background-color: #000;
        color: #ffffff;
    }

    #cadastro form {
        background-color: #ffffff;
        border: 1x solid #e3e8ef;
        border-radius: 12px;
        padding: 20px;
    }

    label {
        display: block;
        font-weight: bold;
        margin: 10px 0 4px;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #cdd6e0;
        border-radius: 6px;
        font-size: 15px;
    }

    input[type="radio"],
    input[type="checkbox"] {
        width: auto;
    }

    #produtos>div {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
    }

    #produtos article {
        flex: 1 1 260px;
        border-radius: 14px;
        box-shadow: 0 2px 10px rgba(13, 27, 42, .06);
        transition: box-shadow.2s, transform .2s;
        backgorund-color: #ffffff;
        border: 1px solid #e3e8ef;
        padding: 16px;

    }

    #produtos article:hover {
        transform: 0 8px 22px rgba(13, 27, 42, -14);
        transform: translateY(-4px);
    }

    #produtos img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 10px;
    }

    <aside class="top-bar">
    <p>⚡Frete Grátis nas compras acima de R$ 299,00 </p>
</aside>

    background-color: #ff6b35; /* Fundo Laranja */
}

}
